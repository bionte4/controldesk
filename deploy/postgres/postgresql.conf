# ControlDesk — Postgres 17 tuning untuk single-VPS production.
#
# Target: 16 GB RAM VPS, ~5-10 tenant trial, ~50 concurrent connections.
# Baseline reference: PGTune "web" profile pada 16 GB / 4 vCPU / SSD.
# Adjust `shared_buffers`, `effective_cache_size`, dan `work_mem` proporsional
# kalau VPS-mu punya RAM berbeda (rule of thumb: 25% RAM untuk shared_buffers,
# 75% untuk effective_cache_size).
#
# Cara apply:
#   Volume-mount ke `/etc/postgresql/postgresql.conf`, lalu Postgres start
#   dengan `-c config_file=/etc/postgresql/postgresql.conf` (sudah diset di
#   docker-compose.prod.yml).
#
# Verifikasi setelah container up:
#   docker exec controldesk-db psql -U postgres -c 'SHOW shared_buffers;'
#   docker exec controldesk-db psql -U postgres -c 'SHOW work_mem;'

# -----------------------------------------------------------------------------
# Connections
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
# Kalau butuh lebih banyak, install pgBouncer sidecar — jangan naikkan
# max_connections langsung karena setiap koneksi = ~10 MB RAM.

superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
# 25% RAM (16 GB → 4 GB). Nilai terlalu besar tidak menambah throughput,
# malah kompetitif dengan OS page cache.
shared_buffers = 4GB

# 75% RAM (16 GB → 12 GB). Hint ke planner soal cache OS.
effective_cache_size = 12GB

# Per-query per-sort. 50 concurrent × 32 MB = 1.6 GB worst case.
work_mem = 32MB

# VACUUM, CREATE INDEX, dsb. Aman naikan karena bukan per-connection.
maintenance_work_mem = 1GB

# Concurrent parallel workers per gather node — 4 vCPU VPS.
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 4

# -----------------------------------------------------------------------------
# WAL & Checkpoints (SSD-tuned)
# -----------------------------------------------------------------------------
wal_level = logical                      # Supabase Realtime butuh 'logical'.
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 16MB
checkpoint_completion_target = 0.9       # Spread checkpoint I/O evenly.
checkpoint_timeout = 15min

# Slot untuk Supabase Realtime + backup tool (mis. pgBackRest).
max_wal_senders = 10
max_replication_slots = 10
max_logical_replication_workers = 4

# -----------------------------------------------------------------------------
# Random Page Cost (SSD)
# -----------------------------------------------------------------------------
# Default 4.0 dirancang untuk HDD. SSD → 1.1 supaya planner favor index scan.
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200           # NVMe SSD default.

# -----------------------------------------------------------------------------
# Autovacuum (agresif — banyak table high-churn: notifications, timesheets)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05    # Trigger di 5% dead rows (default 20%).
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# -----------------------------------------------------------------------------
# Extensions (WAJIB untuk ControlDesk)
# -----------------------------------------------------------------------------
# pg_stat_statements → observability query perf.
# pg_cron            → scheduled jobs (Field Ops SLA reminders, digest).
# pgcrypto           → salary/bank_account encryption (rules §3).
shared_preload_libraries = 'pg_stat_statements,pg_cron,pgaudit,supabase_vault,pg_tle'

# pg_cron config — jalankan job di database `postgres`.
cron.database_name = 'postgres'
cron.use_background_workers = on

# pg_stat_statements config.
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# -----------------------------------------------------------------------------
# Logging (moderate — cukup detil untuk troubleshoot, tidak isi disk)
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off                  # Kita rely pada docker log driver.
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000        # Log query > 1 detik (slow query).
log_checkpoints = on
log_connections = off                    # Terlalu noisy — enable saat debug.
log_disconnections = off
log_lock_waits = on
log_statement = 'ddl'                    # Semua DDL di-log (migration audit).
log_temp_files = 10MB                    # Warning kalau query pakai temp file besar.
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Jakarta'

# -----------------------------------------------------------------------------
# Statement Timeout — cegah runaway query blokir tenant lain
# -----------------------------------------------------------------------------
statement_timeout = 60s                  # Query > 60s auto-abort.
idle_in_transaction_session_timeout = 5min

# -----------------------------------------------------------------------------
# Locale & Timezone
# -----------------------------------------------------------------------------
datestyle = 'iso, dmy'
timezone = 'Asia/Jakarta'
lc_messages = 'en_US.utf8'
lc_monetary = 'id_ID.utf8'
lc_numeric = 'id_ID.utf8'
lc_time = 'id_ID.utf8'
default_text_search_config = 'pg_catalog.english'

# -----------------------------------------------------------------------------
# Security — matikan features yang tidak dibutuhkan
# -----------------------------------------------------------------------------
ssl = off                                # TLS diterminasi di Caddy, bukan di Postgres.
password_encryption = scram-sha-256
row_security = on                        # RLS — WAJIB on (rules §5).

# -----------------------------------------------------------------------------
# Extension: pgaudit — audit trail level DB (rules §3)
# -----------------------------------------------------------------------------
pgaudit.log = 'ddl, role'
pgaudit.log_relation = on
pgaudit.log_parameter = on
