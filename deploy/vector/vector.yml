# ControlDesk — Vector log aggregator config.
#
# Vector menjadi dependency `depends_on` untuk Postgres di docker-compose.prod.yml
# supaya boot order deterministik. Konfig default cukup minimal — kumpulkan
# log dari docker socket lalu tulis ke stdout (yang akan di-collect docker
# log driver + rotasi 10 MB × 3 file).
#
# Kalau butuh forward ke Loki/Datadog/Grafana Cloud, ubah `sinks.out` di bawah
# dari `console` ke sink yang sesuai. Doc: https://vector.dev/docs/reference/configuration/sinks/

api:
  enabled: true
  address: "0.0.0.0:9001"

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - controldesk-vector
      - controldesk-caddy    # Caddy sudah log JSON sendiri.

transforms:
  # Enrich dengan metadata standar (env, service).
  add_metadata:
    type: remap
    inputs:
      - docker_host
    source: |
      .env = "production"
      .stack = "controldesk"

sinks:
  # Default: forward ke stdout (docker log driver menangkap).
  out:
    type: console
    inputs:
      - add_metadata
    encoding:
      codec: json
