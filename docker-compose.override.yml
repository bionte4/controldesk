# ControlDesk — local development override (auto-loaded by `docker compose`).
#
# Why this file exists:
# ---------------------
# In development we run Next.js via `pnpm dev` (Turbopack, hot-reload).
# The `app` service in the base `docker-compose.yml` builds a production
# image that binds port 3000 too — if it's running, browsers hit the
# STALE container instead of `pnpm dev`, and none of your code changes
# show up until the image is rebuilt.
#
# This override moves `app` behind the `prod` profile so it does NOT
# start on a plain `docker compose up`. To boot the production image
# on purpose (smoke test, CI parity check, offline demo), run:
#
#   pnpm docker:rebuild     # rebuild image with current code
#   pnpm docker:app         # start ONLY the app container
#   pnpm docker:app:down    # stop it again
#
# Dependencies (redis, mailpit) still start with a plain
# `pnpm docker:deps` so you can iterate on Next.js with everything
# else already running.

services:
  app:
    profiles:
      - prod
    restart: "no"
