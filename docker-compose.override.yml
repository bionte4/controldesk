# ControlDesk — local development override (auto-loaded by `docker compose`).
#
# Why this file exists:
# ---------------------
# In development we run Next.js via `pnpm dev` (Turbopack, hot-reload).
# The `app` service in the base `docker-compose.yml` builds a production
# image that also binds port 3000 — if it's running, browsers hit the
# STALE container instead of `pnpm dev`, and none of your code changes
# show up until the image is rebuilt.
#
# This override does two things:
#   1. Moves `app` behind the `prod` profile so it does NOT start on a
#      plain `docker compose up`.
#   2. When you DO start it (`pnpm docker:app`), maps the container to
#      host port 3001 instead of 3000 so `pnpm dev` (3000) and the
#      production container (3001) can run side-by-side for comparison
#      smoke tests.
#
# Typical dev workflow (Turbopack hot-reload):
#   pnpm docker:deps        # redis + mailpit
#   pnpm dev                # Next.js dev server at http://localhost:3000
#
# Production parity smoke test (side-by-side with dev):
#   pnpm docker:rebuild     # rebuild image with current code
#   pnpm docker:app         # start container at http://localhost:3001
#   # compare `:3000` (dev) vs `:3001` (prod build) in two browser tabs
#   pnpm docker:app:down    # stop prod container when done
#
# Port + root-domain wiring:
# ---------------------------
# Because the prod profile binds to host port 3001 (see `ports:` below)
# while `pnpm dev` owns 3000, we MUST override `NEXT_PUBLIC_ROOT_DOMAIN`
# at both build time (baked into the client bundle) AND runtime (used by
# server-only URL builders — e.g. workspace-signup verification links,
# tenant subdomain redirects, emailed CTAs). Without this override, an
# email verification URL ends up pointing at `http://localhost:3000/…`
# even though the container is only reachable at `:3001` — browsers get
# `ERR_CONNECTION_REFUSED` and users cannot complete signup.
#
# Base compose keeps `localhost:3000` because that's the port `pnpm
# dev` (Turbopack, unchanged) actually binds to; this override flips it
# to `:3001` ONLY for the prod-profile container.

services:
  app:
    profiles:
      - prod
    restart: "no"
    # Bake the correct root domain into the standalone client bundle at
    # BUILD time. `NEXT_PUBLIC_*` vars are frozen when the bundle is
    # generated, so a runtime override alone is not sufficient.
    build:
      args:
        NEXT_PUBLIC_ROOT_DOMAIN: "localhost:3001"
    # Also override at RUNTIME so server-only helpers like
    # `resolveTenantFromHost()` + the signup verify-URL builder read
    # the same value the browser sees.
    environment:
      NEXT_PUBLIC_ROOT_DOMAIN: "localhost:3001"
    # Compose merges list fields by APPENDING, so a bare `ports:` list here
    # would end up binding both 3000 AND 3001 to container:3000 (second
    # bind fails). The `!override` tag replaces the base list entirely.
    ports: !override
      - "3001:3000"
