name: Docker

# Verifies the production Docker image still builds cleanly. This is a
# *smoke check*, not a publish step — pushing to a registry is
# intentionally left commented so consumers can enable it once their
# registry credentials are configured as repository secrets.
#
# Runs on:
#   • Every push to `main` (post-merge verification)
#   • Every tag matching `v*` (release build)
#   • Manual dispatch via the Actions tab

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      # Uncomment to push to GitHub Container Registry.
      # packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Uncomment the block below to publish to ghcr.io -----------
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------------------------

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            controldesk
            # ghcr.io/${{ github.repository_owner }}/controldesk
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build image (no push by default)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Print image size
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker image inspect "$IMG" --format 'ControlDesk image: {{.Size}} bytes' || true
          docker image ls "$IMG" || true
